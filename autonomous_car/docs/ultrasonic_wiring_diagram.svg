<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 800"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient><linearGradient id="rpiPcb" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#047857"/></linearGradient><linearGradient id="hcPcb" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#2563eb"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><filter id="dropShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><rect width="1200" height="800" fill="url(#bgGrad)"/><g transform="translate(60, 40)"><text x="0" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold">HC-SR04 Ultrasonic Sensor + 3.3V Voltage Divider</text><text x="0" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Protects Raspberry Pi 4 GPIO 25 by converting 5.0V Echo pulse down to safe 3.33V logic</text><line x1="0" x2="1080" y1="75" y2="75" stroke="#334155" stroke-width="1.5"/></g><g filter="url(#dropShadow)" transform="translate(60, 150)"><rect width="320" height="570" fill="url(#rpiPcb)" stroke="#10b981" stroke-width="2" rx="16"/><text x="160" y="36" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Raspberry Pi 4 Model B</text><text x="160" y="58" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">40-Pin GPIO Expansion Header</text><rect width="260" height="460" x="30" y="80" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" rx="8"/><text x="80" y="105" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">LEFT (Odd)</text><text x="240" y="105" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">RIGHT (Even)</text><circle cx="80" cy="130" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="2"/><text x="60" y="134" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="end">Pin 1 (3.3V)</text><circle cx="240" cy="130" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="2"/><text x="220" y="134" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="end">Pin 2 (5V)</text><circle cx="80" cy="170" r="7" fill="#64748b"/><text x="60" y="174" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Pin 3</text><circle cx="240" cy="170" r="10" fill="#ef4444" stroke="#fff" stroke-width="2.5"/><text x="220" y="174" fill="#f87171" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Pin 4 (5V_VCC) 🔴</text><circle cx="80" cy="210" r="7" fill="#64748b"/><circle cx="240" cy="210" r="7" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="220" y="214" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">Pin 6 (GND)</text><circle cx="80" cy="250" r="7" fill="#64748b"/><circle cx="240" cy="250" r="7" fill="#64748b"/><circle cx="80" cy="290" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/><text x="60" y="294" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Pin 9 (GND) ⚫</text><circle cx="240" cy="290" r="7" fill="#64748b"/><circle cx="80" cy="330" r="7" fill="#64748b"/><circle cx="240" cy="330" r="7" fill="#64748b"/><circle cx="80" cy="370" r="7" fill="#64748b"/><circle cx="240" cy="370" r="7" fill="#64748b"/><circle cx="80" cy="410" r="7" fill="#64748b"/><circle cx="240" cy="410" r="7" fill="#64748b"/><circle cx="80" cy="450" r="7" fill="#64748b"/><circle cx="240" cy="450" r="10" fill="#a855f7" stroke="#fff" stroke-width="2.5"/><text x="220" y="454" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Pin 18 (GPIO 24) 🟣</text><circle cx="80" cy="490" r="7" fill="#64748b"/><circle cx="240" cy="490" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/><text x="220" y="494" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Pin 20 (GND) ⚫</text><circle cx="80" cy="520" r="7" fill="#64748b"/><circle cx="240" cy="520" r="10" fill="#10b981" stroke="#fff" stroke-width="2.5"/><text x="220" y="524" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">Pin 22 (GPIO 25) 🟢</text></g><g filter="url(#dropShadow)" transform="translate(800, 150)"><rect width="340" height="200" fill="url(#hcPcb)" stroke="#60a5fa" stroke-width="2" rx="12"/><text x="170" y="32" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">HC-SR04 Ultrasonic Sensor</text><circle cx="85" cy="100" r="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/><circle cx="85" cy="100" r="28" fill="#64748b"/><text x="85" y="106" fill="#fff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">T</text><text x="85" y="160" fill="#bfdbfe" font-family="sans-serif" font-size="11" text-anchor="middle">Transmitter</text><circle cx="255" cy="100" r="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/><circle cx="255" cy="100" r="28" fill="#64748b"/><text x="255" y="106" fill="#fff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">R</text><text x="255" y="160" fill="#bfdbfe" font-family="sans-serif" font-size="11" text-anchor="middle">Receiver</text><rect width="180" height="24" x="80" y="188" fill="#0f172a" stroke="#475569" stroke-width="1.5" rx="4"/><circle cx="105" cy="200" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/><text x="105" y="228" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">VCC</text><text x="105" y="240" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">(5V)</text><circle cx="145" cy="200" r="6" fill="#a855f7" stroke="#fff" stroke-width="1.5"/><text x="145" y="228" fill="#d8b4fe" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">TRIG</text><text x="145" y="240" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">(Pulse)</text><circle cx="185" cy="200" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/><text x="185" y="228" fill="#fcd34d" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ECHO</text><text x="185" y="240" fill="#ef4444" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">(5.0V!)</text><circle cx="225" cy="200" r="6" fill="#38bdf8" stroke="#fff" stroke-width="1.5"/><text x="225" y="228" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GND</text><text x="225" y="240" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">(0V)</text></g><g filter="url(#dropShadow)" transform="translate(430, 390)"><rect width="320" height="330" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" rx="16"/><text x="160" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">3.3V Voltage Divider Circuit</text><text x="160" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Safe logic conversion point</text><circle cx="60" cy="100" r="8" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="60" y="80" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">ECHO In (5.0V)</text><g transform="translate(60, 95)"><line x1="0" x2="35" y1="5" y2="5" stroke="#f59e0b" stroke-width="3"/><rect width="80" height="30" x="35" y="-10" fill="#d97706" stroke="#92400e" stroke-width="2" rx="6"/><line x1="48" x2="48" y1="-9" y2="19" stroke="#78350f" stroke-width="5"/><line x1="62" x2="62" y1="-9" y2="19" stroke="#09090b" stroke-width="5"/><line x1="76" x2="76" y1="-9" y2="19" stroke="#dc2626" stroke-width="5"/><line x1="98" x2="98" y1="-9" y2="19" stroke="#fbbf24" stroke-width="4"/><line x1="115" x2="150" y1="5" y2="5" stroke="#10b981" stroke-width="3"/></g><text x="110" y="132" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">R1: 1.0 kΩ Resistor</text><circle cx="210" cy="100" r="10" fill="#10b981" stroke="#fff" stroke-width="3"/><text x="210" y="75" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Safe 3.33V Point</text><text x="210" y="125" fill="#a7f3d0" font-family="sans-serif" font-size="10" text-anchor="middle">To Pi Pin 22 (GPIO 25)</text><g transform="translate(205, 100)"><line x1="5" x2="5" y1="0" y2="40" stroke="#10b981" stroke-width="3"/><rect width="30" height="80" x="-10" y="40" fill="#d97706" stroke="#92400e" stroke-width="2" rx="6"/><line x1="-9" x2="19" y1="52" y2="52" stroke="#dc2626" stroke-width="5"/><line x1="-9" x2="19" y1="66" y2="66" stroke="#09090b" stroke-width="5"/><line x1="-9" x2="19" y1="80" y2="80" stroke="#dc2626" stroke-width="5"/><line x1="-9" x2="19" y1="102" y2="102" stroke="#fbbf24" stroke-width="4"/><line x1="5" x2="5" y1="120" y2="160" stroke="#38bdf8" stroke-width="3"/></g><text x="260" y="185" fill="#fde68a" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start">R2: 2.0 kΩ</text><text x="260" y="200" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="start">(or 2x 1kΩ in series)</text><circle cx="210" cy="260" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/><text x="210" y="290" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Ground Rail (0V)</text><text x="210" y="305" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Connected to Pi Pin 20</text></g><path fill="none" stroke="#ef4444" stroke-linecap="round" stroke-width="4.5" d="M 300 320 C 500 240, 700 220, 905 350"/><circle cx="905" cy="350" r="5" fill="#ef4444"/><rect width="130" height="24" x="540" y="225" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" rx="4"/><text x="605" y="241" fill="#fecaca" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5V Power (Pin 4)</text><path fill="none" stroke="#a855f7" stroke-linecap="round" stroke-width="4.5" d="M 300 600 C 600 580, 800 500, 945 350"/><circle cx="945" cy="350" r="5" fill="#a855f7"/><rect width="140" height="24" x="560" y="555" fill="#581c87" stroke="#c084fc" stroke-width="1.5" rx="4"/><text x="630" y="571" fill="#f3e8ff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TRIG Pulse (GPIO 24)</text><path fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-width="4.5" d="M 985 350 C 985 450, 700 480, 490 490"/><circle cx="490" cy="490" r="5" fill="#f59e0b"/><rect width="130" height="24" x="750" y="430" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" rx="4"/><text x="815" y="446" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ECHO Pulse (5.0V)</text><path fill="none" stroke="#10b981" stroke-linecap="round" stroke-width="4.5" d="M 640 490 C 500 500, 400 640, 300 670"/><circle cx="300" cy="670" r="5" fill="#10b981"/><rect width="140" height="24" x="360" y="570" fill="#064e3b" stroke="#34d399" stroke-width="1.5" rx="4"/><text x="430" y="586" fill="#d1fae5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Safe 3.3V (GPIO 25)</text><path fill="none" stroke="#38bdf8" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="4" d="M 300 640 C 400 640, 450 645, 640 650"/><path fill="none" stroke="#38bdf8" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="4" d="M 640 650 C 850 650, 1025 550, 1025 350"/><circle cx="1025" cy="350" r="5" fill="#38bdf8"/><rect width="120" height="24" x="790" y="635" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" rx="4"/><text x="850" y="651" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Shared GND (0V)</text><g><text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="12" transform="translate(60, 730)">Voltage Divider Equation:</text><text x="160" y="16" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" transform="translate(60, 730)">V_out = 5.0V × [ 2000Ω / (1000Ω + 2000Ω) ] = 3.33V (Safe for BCM2711 SoC)</text><text x="800" y="16" fill="#f87171" font-family="sans-serif" font-size="12" font-weight="bold" transform="translate(60, 730)">⚠️ NEVER connect ECHO directly without resistors!</text></g></svg>