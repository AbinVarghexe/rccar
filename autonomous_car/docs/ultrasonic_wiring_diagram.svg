<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="rpiPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="hcPcb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Header Banner -->
  <g transform="translate(60, 40)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">HC-SR04 Ultrasonic Sensor + 3.3V Voltage Divider</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">Protects Raspberry Pi 4 GPIO 25 by converting 5.0V Echo pulse down to safe 3.33V logic</text>
    <line x1="0" y1="75" x2="1080" y2="75" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- ==================== LEFT: RASPBERRY PI 4 ==================== -->
  <g transform="translate(60, 150)" filter="url(#dropShadow)">
    <!-- Board PCB -->
    <rect width="320" height="570" rx="16" fill="url(#rpiPcb)" stroke="#10b981" stroke-width="2" />
    <text x="160" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#ecfdf5" text-anchor="middle">Raspberry Pi 4 Model B</text>
    <text x="160" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle">40-Pin GPIO Expansion Header</text>

    <!-- Header Frame -->
    <rect x="30" y="80" width="260" height="460" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    
    <!-- Header Labels -->
    <text x="80" y="105" font-family="monospace" font-size="11" font-weight="bold" fill="#a1a1aa" text-anchor="middle">LEFT (Odd)</text>
    <text x="240" y="105" font-family="monospace" font-size="11" font-weight="bold" fill="#a1a1aa" text-anchor="middle">RIGHT (Even)</text>

    <!-- Pins Representation -->
    <!-- Pin 1 & 2 -->
    <circle cx="80" cy="130" r="7" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
    <text x="60" y="134" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="end">Pin 1 (3.3V)</text>
    <circle cx="240" cy="130" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <text x="220" y="134" font-family="monospace" font-size="10" fill="#cbd5e1" text-anchor="end">Pin 2 (5V)</text>

    <!-- Pin 3 & 4 -->
    <circle cx="80" cy="170" r="7" fill="#64748b" />
    <text x="60" y="174" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="end">Pin 3</text>
    <!-- PIN 4 (5V POWER) - ACTIVE -->
    <circle cx="240" cy="170" r="10" fill="#ef4444" stroke="#ffffff" stroke-width="2.5" />
    <text x="220" y="174" font-family="monospace" font-size="11" font-weight="bold" fill="#f87171" text-anchor="end">Pin 4 (5V_VCC) 🔴</text>

    <!-- Pin 5 & 6 -->
    <circle cx="80" cy="210" r="7" fill="#64748b" />
    <circle cx="240" cy="210" r="7" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="220" y="214" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="end">Pin 6 (GND)</text>

    <!-- Pin 7 & 8 -->
    <circle cx="80" cy="250" r="7" fill="#64748b" />
    <circle cx="240" cy="250" r="7" fill="#64748b" />

    <!-- Pin 9 (GND) - ACTIVE -->
    <circle cx="80" cy="290" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="60" y="294" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="end">Pin 9 (GND) ⚫</text>
    <circle cx="240" cy="290" r="7" fill="#64748b" />

    <!-- Pins 11 to 16 -->
    <circle cx="80" cy="330" r="7" fill="#64748b" />
    <circle cx="240" cy="330" r="7" fill="#64748b" />
    <circle cx="80" cy="370" r="7" fill="#64748b" />
    <circle cx="240" cy="370" r="7" fill="#64748b" />
    <circle cx="80" cy="410" r="7" fill="#64748b" />
    <circle cx="240" cy="410" r="7" fill="#64748b" />

    <!-- Pin 17 & 18 -->
    <circle cx="80" cy="450" r="7" fill="#64748b" />
    <!-- PIN 18 (GPIO 24 - TRIG) - ACTIVE -->
    <circle cx="240" cy="450" r="10" fill="#a855f7" stroke="#ffffff" stroke-width="2.5" />
    <text x="220" y="454" font-family="monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="end">Pin 18 (GPIO 24) 🟣</text>

    <!-- Pin 19 & 20 -->
    <circle cx="80" cy="490" r="7" fill="#64748b" />
    <!-- PIN 20 (GND) - ACTIVE -->
    <circle cx="240" cy="490" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="220" y="494" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="end">Pin 20 (GND) ⚫</text>

    <!-- Pin 21 & 22 -->
    <circle cx="80" cy="520" r="7" fill="#64748b" />
    <!-- PIN 22 (GPIO 25 - ECHO SAFE 3.3V) - ACTIVE -->
    <circle cx="240" cy="520" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
    <text x="220" y="524" font-family="monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="end">Pin 22 (GPIO 25) 🟢</text>
  </g>

  <!-- ==================== RIGHT: HC-SR04 SENSOR ==================== -->
  <g transform="translate(800, 150)" filter="url(#dropShadow)">
    <!-- Sensor PCB -->
    <rect width="340" height="200" rx="12" fill="url(#hcPcb)" stroke="#60a5fa" stroke-width="2" />
    <text x="170" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">HC-SR04 Ultrasonic Sensor</text>

    <!-- Ultrasonic Transducer Cylinders -->
    <circle cx="85" cy="100" r="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4" />
    <circle cx="85" cy="100" r="28" fill="#64748b" />
    <text x="85" y="106" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">T</text>
    <text x="85" y="160" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Transmitter</text>

    <circle cx="255" cy="100" r="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4" />
    <circle cx="255" cy="100" r="28" fill="#64748b" />
    <text x="255" y="106" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">R</text>
    <text x="255" y="160" font-family="sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Receiver</text>

    <!-- Pin Header at Bottom of Sensor -->
    <rect x="80" y="188" width="180" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    
    <!-- 4 Pins -->
    <!-- Pin 1: VCC -->
    <circle cx="105" cy="200" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="105" y="228" font-family="monospace" font-size="11" font-weight="bold" fill="#fca5a5" text-anchor="middle">VCC</text>
    <text x="105" y="240" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(5V)</text>

    <!-- Pin 2: TRIG -->
    <circle cx="145" cy="200" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="1.5" />
    <text x="145" y="228" font-family="monospace" font-size="11" font-weight="bold" fill="#d8b4fe" text-anchor="middle">TRIG</text>
    <text x="145" y="240" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(Pulse)</text>

    <!-- Pin 3: ECHO -->
    <circle cx="185" cy="200" r="6" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <text x="185" y="228" font-family="monospace" font-size="11" font-weight="bold" fill="#fcd34d" text-anchor="middle">ECHO</text>
    <text x="185" y="240" font-family="monospace" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">(5.0V!)</text>

    <!-- Pin 4: GND -->
    <circle cx="225" cy="200" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
    <text x="225" y="228" font-family="monospace" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">GND</text>
    <text x="225" y="240" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">(0V)</text>
  </g>

  <!-- ==================== CENTER: VOLTAGE DIVIDER BREADBOARD ==================== -->
  <g transform="translate(430, 390)" filter="url(#dropShadow)">
    <!-- Breadboard / Circuit Card -->
    <rect width="320" height="330" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">3.3V Voltage Divider Circuit</text>
    <text x="160" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Safe logic conversion point</text>

    <!-- ECHO 5V INPUT POINT -->
    <circle cx="60" cy="100" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    <text x="60" y="80" font-family="monospace" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">ECHO In (5.0V)</text>

    <!-- 1 kΩ RESISTOR -->
    <!-- Resistor Body -->
    <g transform="translate(60, 95)">
      <line x1="0" y1="5" x2="35" y2="5" stroke="#f59e0b" stroke-width="3" />
      <rect x="35" y="-10" width="80" height="30" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2" />
      <!-- Color Bands: Brown, Black, Red, Gold -->
      <line x1="48" y1="-9" x2="48" y2="19" stroke="#78350f" stroke-width="5" /> <!-- Brown -->
      <line x1="62" y1="-9" x2="62" y2="19" stroke="#09090b" stroke-width="5" /> <!-- Black -->
      <line x1="76" y1="-9" x2="76" y2="19" stroke="#dc2626" stroke-width="5" /> <!-- Red -->
      <line x1="98" y1="-9" x2="98" y2="19" stroke="#fbbf24" stroke-width="4" /> <!-- Gold -->
      <line x1="115" y1="5" x2="150" y2="5" stroke="#10b981" stroke-width="3" />
    </g>
    <text x="110" y="132" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="middle">R1: 1.0 kΩ Resistor</text>

    <!-- SAFE JUNCTION POINT (3.33V) -->
    <circle cx="210" cy="100" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3" />
    <text x="210" y="75" font-family="monospace" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">Safe 3.33V Point</text>
    <text x="210" y="125" font-family="sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">To Pi Pin 22 (GPIO 25)</text>

    <!-- 2 kΩ RESISTOR (VERTICAL) -->
    <g transform="translate(205, 100)">
      <line x1="5" y1="0" x2="5" y2="40" stroke="#10b981" stroke-width="3" />
      <rect x="-10" y="40" width="30" height="80" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2" />
      <!-- Color Bands: Red, Black, Red, Gold -->
      <line x1="-9" y1="52" x2="19" y2="52" stroke="#dc2626" stroke-width="5" /> <!-- Red -->
      <line x1="-9" y1="66" x2="19" y2="66" stroke="#09090b" stroke-width="5" /> <!-- Black -->
      <line x1="-9" y1="80" x2="19" y2="80" stroke="#dc2626" stroke-width="5" /> <!-- Red -->
      <line x1="-9" y1="102" x2="19" y2="102" stroke="#fbbf24" stroke-width="4" /> <!-- Gold -->
      <line x1="5" y1="120" x2="5" y2="160" stroke="#38bdf8" stroke-width="3" />
    </g>
    <text x="260" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fde68a" text-anchor="start">R2: 2.0 kΩ</text>
    <text x="260" y="200" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="start">(or 2x 1kΩ in series)</text>

    <!-- GND TIE POINT -->
    <circle cx="210" cy="260" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
    <text x="210" y="290" font-family="monospace" font-size="11" font-weight="bold" fill="#7dd3fc" text-anchor="middle">Ground Rail (0V)</text>
    <text x="210" y="305" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Connected to Pi Pin 20</text>
  </g>

  <!-- ==================== CONNECTING WIRES ==================== -->
  <!-- Wire 1: 5V Power (Red) from Pi Pin 4 -> HC-SR04 VCC -->
  <path d="M 300 320 C 500 240, 700 220, 905 350" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="905" cy="350" r="5" fill="#ef4444" />
  <!-- Wire Label 1 -->
  <rect x="540" y="225" width="130" height="24" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5" />
  <text x="605" y="241" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fecaca" text-anchor="middle">5V Power (Pin 4)</text>

  <!-- Wire 2: TRIG (Purple) from Pi Pin 18 (GPIO 24) -> HC-SR04 TRIG -->
  <path d="M 300 600 C 600 580, 800 500, 945 350" fill="none" stroke="#a855f7" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="945" cy="350" r="5" fill="#a855f7" />
  <!-- Wire Label 2 -->
  <rect x="560" y="555" width="140" height="24" rx="4" fill="#581c87" stroke="#c084fc" stroke-width="1.5" />
  <text x="630" y="571" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f3e8ff" text-anchor="middle">TRIG Pulse (GPIO 24)</text>

  <!-- Wire 3: ECHO (Amber 5V) from HC-SR04 ECHO -> Breadboard Input -->
  <path d="M 985 350 C 985 450, 700 480, 490 490" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="490" cy="490" r="5" fill="#f59e0b" />
  <!-- Wire Label 3 -->
  <rect x="750" y="430" width="130" height="24" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
  <text x="815" y="446" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">ECHO Pulse (5.0V)</text>

  <!-- Wire 4: SAFE 3.3V SIGNAL (Green) from Divider Junction -> Pi Pin 22 (GPIO 25) -->
  <path d="M 640 490 C 500 500, 400 640, 300 670" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="300" cy="670" r="5" fill="#10b981" />
  <!-- Wire Label 4 -->
  <rect x="360" y="570" width="140" height="24" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
  <text x="430" y="586" font-family="sans-serif" font-size="11" font-weight="bold" fill="#d1fae5" text-anchor="middle">Safe 3.3V (GPIO 25)</text>

  <!-- Wire 5: Ground from Pi Pin 20 -> Breadboard GND Rail -->
  <path d="M 300 640 C 400 640, 450 645, 640 650" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4" />
  
  <!-- Wire 6: Ground from Breadboard GND Rail -> HC-SR04 GND -->
  <path d="M 640 650 C 850 650, 1025 550, 1025 350" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6,4" />
  <circle cx="1025" cy="350" r="5" fill="#38bdf8" />
  <rect x="790" y="635" width="120" height="24" rx="4" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" />
  <text x="850" y="651" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e0f2fe" text-anchor="middle">Shared GND (0V)</text>

  <!-- ==================== FORMULA / ALERT BOX ==================== -->
  <g transform="translate(60, 730)">
    <text x="0" y="16" font-family="sans-serif" font-size="12" fill="#94a3b8">Voltage Divider Equation:</text>
    <text x="160" y="16" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">V_out = 5.0V × [ 2000Ω / (1000Ω + 2000Ω) ] = 3.33V (Safe for BCM2711 SoC)</text>
    <text x="800" y="16" font-family="sans-serif" font-size="12" fill="#f87171" font-weight="bold">⚠️ NEVER connect ECHO directly without resistors!</text>
  </g>
</svg>
