<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" style="background:#0c0d12;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#14161f"/><stop offset="100%" stop-color="#0a0b0f"/></linearGradient><linearGradient id="piGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e5436"/><stop offset="100%" stop-color="#133824"/></linearGradient><linearGradient id="motorGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#801818"/><stop offset="100%" stop-color="#4d0e0e"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1a1c24"/><stop offset="100%" stop-color="#121318"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1280" height="840" fill="url(#bgGrad)"/><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><rect width="1280" height="840" fill="url(#grid)"/><g><text x="0" y="0" fill="#f5f5f7" font-size="24" font-weight="700" letter-spacing="-.02em" transform="translate(50, 45)">Autonomous RC Car — Hardware Wiring &amp; Pinout Diagram</text><text x="0" y="24" fill="#86868b" font-size="13" font-weight="500" transform="translate(50, 45)">Raspberry Pi 4 Model B (40-Pin Header) • L298N Motor Driver • SG90 Servo • HC-SR04 Ultrasonic • CSI Camera</text></g><g transform="translate(50, 100)"><rect width="440" height="690" fill="url(#piGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="18"/><text x="25" y="38" fill="#fff" font-size="18" font-weight="700" letter-spacing="-.01em">Raspberry Pi 4 Model B</text><text x="25" y="58" fill="#75d69c" font-size="11" font-weight="600" letter-spacing=".05em">40-PIN EXPANSION HEADER (J8)</text><rect width="130" height="55" x="25" y="600" fill="#0d2618" stroke="#34c759" stroke-width="1.2" rx="8"/><text x="35" y="625" fill="#fff" font-size="11" font-weight="700">CSI CAMERA</text><text x="35" y="642" fill="#8ae0a8" font-size="9" font-weight="500">OV5647 Ribbon</text><rect width="130" height="55" x="25" y="525" fill="#1b1c24" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" rx="8"/><text x="35" y="550" fill="#fff" font-size="11" font-weight="700">5V USB-C IN</text><text x="35" y="567" fill="#86868b" font-size="9" font-weight="500">5V / 3A Buck Output</text><g transform="translate(200, 45)"><rect width="215" height="625" x="0" y="0" fill="#0f1118" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="10"/><text x="35" y="22" fill="#86868b" font-size="10" font-weight="700">PIN (L)</text><text x="145" y="22" fill="#86868b" font-size="10" font-weight="700">PIN (R)</text><circle cx="70" cy="50" r="7" fill="#ff9f0a"/><text x="18" y="54" fill="#ff9f0a" font-size="10" font-weight="700">1 (3V3)</text><circle cx="120" cy="50" r="7" fill="#ff453a" filter="url(#glow)"/><text x="135" y="54" fill="#ff453a" font-size="10" font-weight="700">2 (5V-Servo)</text><circle cx="70" cy="80" r="6" fill="#48484a"/><text x="35" y="84" fill="#86868b" font-size="9">3</text><circle cx="120" cy="80" r="7" fill="#ff453a" filter="url(#glow)"/><text x="135" y="84" fill="#ff453a" font-size="10" font-weight="700">4 (5V-US)</text><circle cx="70" cy="110" r="6" fill="#48484a"/><text x="35" y="114" fill="#86868b" font-size="9">5</text><circle cx="120" cy="110" r="7" fill="#fff" filter="url(#glow)"/><text x="135" y="114" fill="#fff" font-size="10" font-weight="700">6 (GND)</text><circle cx="70" cy="140" r="6" fill="#48484a"/><circle cx="120" cy="140" r="6" fill="#48484a"/><circle cx="70" cy="170" r="6" fill="#48484a"/><circle cx="120" cy="170" r="6" fill="#48484a"/><circle cx="70" cy="200" r="7" fill="#0a84ff" filter="url(#glow)"/><text x="8" y="204" fill="#0a84ff" font-size="10" font-weight="700">11 (IN1)</text><circle cx="120" cy="200" r="7" fill="#5e5ce6" filter="url(#glow)"/><text x="135" y="204" fill="#5e5ce6" font-size="10" font-weight="700">12 (IN2-Alt)</text><circle cx="70" cy="230" r="7" fill="#5e5ce6" filter="url(#glow)"/><text x="8" y="234" fill="#5e5ce6" font-size="10" font-weight="700">13 (IN2)</text><circle cx="120" cy="230" r="6" fill="#48484a"/><text x="135" y="234" fill="#86868b" font-size="9">14 (GND)</text><circle cx="70" cy="260" r="7" fill="#bf5af2" filter="url(#glow)"/><text x="8" y="264" fill="#bf5af2" font-size="10" font-weight="700">15 (IN3)</text><circle cx="120" cy="260" r="7" fill="#ff375f" filter="url(#glow)"/><text x="135" y="264" fill="#ff375f" font-size="10" font-weight="700">16 (IN4)</text><circle cx="70" cy="290" r="6" fill="#ff9f0a"/><text x="25" y="294" fill="#ff9f0a" font-size="9">17</text><circle cx="120" cy="290" r="7" fill="#ffd60a" filter="url(#glow)"/><text x="135" y="294" fill="#ffd60a" font-size="10" font-weight="700">18 (TRIG)</text><circle cx="70" cy="320" r="6" fill="#48484a"/><circle cx="120" cy="320" r="7" fill="#fff" filter="url(#glow)"/><text x="135" y="324" fill="#fff" font-size="10" font-weight="700">20 (GND)</text><circle cx="70" cy="350" r="6" fill="#48484a"/><circle cx="120" cy="350" r="7" fill="#30d158" filter="url(#glow)"/><text x="135" y="354" fill="#30d158" font-size="10" font-weight="700">22 (ECHO)</text><line x1="70" x2="70" y1="375" y2="445" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3 3"/><line x1="120" x2="120" y1="375" y2="445" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3 3"/><text x="80" y="415" fill="#636366" font-size="9">...</text><circle cx="70" cy="480" r="6" fill="#48484a"/><text x="25" y="484" fill="#86868b" font-size="9">31</text><circle cx="120" cy="480" r="7" fill="#ff9f0a" filter="url(#glow)"/><text x="135" y="484" fill="#ff9f0a" font-size="10" font-weight="700">32 (SERVO)</text><circle cx="70" cy="580" r="7" fill="#fff"/><text x="15" y="584" fill="#fff" font-size="10">39 (GND)</text><circle cx="120" cy="580" r="6" fill="#48484a"/><text x="135" y="584" fill="#86868b" font-size="9">40</text></g></g><g transform="translate(680, 100)"><rect width="480" height="230" fill="url(#motorGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" rx="14"/><text x="24" y="32" fill="#fff" font-size="16" font-weight="700">L298N Dual H-Bridge Motor Driver</text><text x="24" y="50" fill="#ffb3b3" font-size="11" font-weight="500">100Hz Software PWM Differential Skid Steering</text><g transform="translate(24, 75)"><rect width="200" height="135" x="0" y="0" fill="#1b1c24" stroke="rgba(255,255,255,0.1)" rx="8"/><text x="14" y="24" fill="#86868b" font-size="11" font-weight="700">LOGIC INPUT TERMINALS</text><circle cx="25" cy="48" r="5" fill="#0a84ff"/><text x="40" y="52" fill="#fff" font-size="11" font-weight="700">IN1</text><text x="80" y="52" fill="#86868b" font-size="10">← Pi Pin 11 (GPIO 17)</text><circle cx="25" cy="74" r="5" fill="#5e5ce6"/><text x="40" y="78" fill="#fff" font-size="11" font-weight="700">IN2</text><text x="80" y="78" fill="#86868b" font-size="10">← Pi Pin 12 (GPIO 18)</text><circle cx="25" cy="100" r="5" fill="#bf5af2"/><text x="40" y="104" fill="#fff" font-size="11" font-weight="700">IN3</text><text x="80" y="104" fill="#86868b" font-size="10">← Pi Pin 15 (GPIO 22)</text><circle cx="25" cy="122" r="5" fill="#ff375f"/><text x="40" y="126" fill="#fff" font-size="11" font-weight="700">IN4</text><text x="80" y="126" fill="#86868b" font-size="10">← Pi Pin 16 (GPIO 23)</text></g><g transform="translate(248, 75)"><rect width="208" height="135" x="0" y="0" fill="#1b1c24" stroke="rgba(255,255,255,0.1)" rx="8"/><text x="14" y="24" fill="#86868b" font-size="11" font-weight="700">POWER &amp; MOTOR OUTPUTS</text><text x="14" y="50" fill="#ff453a" font-size="11" font-weight="700">12V / VCC:</text><text x="85" y="50" fill="#f5f5f7" font-size="10">Battery (+) 7.4V - 12V</text><text x="14" y="74" fill="#fff" font-size="11" font-weight="700">GND:</text><text x="85" y="74" fill="#f5f5f7" font-size="10">Battery (-) &amp; Pi Pin 6</text><text x="14" y="98" fill="#30d158" font-size="11" font-weight="700">OUT 1 / 2:</text><text x="85" y="98" fill="#f5f5f7" font-size="10">Left DC Motors</text><text x="14" y="122" fill="#30d158" font-size="11" font-weight="700">OUT 3 / 4:</text><text x="85" y="122" fill="#f5f5f7" font-size="10">Right DC Motors</text></g></g><g transform="translate(680, 360)"><rect width="480" height="145" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" rx="14"/><text x="24" y="30" fill="#fff" font-size="16" font-weight="700">SG90 Camera Pan Servo Motor</text><text x="24" y="48" fill="#86868b" font-size="11" font-weight="500">180° Panoramic Sweep (0° Left, 90° Center, 180° Right) • Auto-Relax Protection</text><g transform="translate(24, 65)"><circle cx="15" cy="18" r="6" fill="#ff9f0a"/><text x="32" y="22" fill="#ff9f0a" font-size="12" font-weight="700">Orange (PWM):</text><text x="150" y="22" fill="#f5f5f7" font-size="11">Pi Pin 32 (GPIO 12, Hardware PWM0)</text><circle cx="15" cy="44" r="6" fill="#ff453a"/><text x="32" y="48" fill="#ff453a" font-size="12" font-weight="700">Red (VCC 5V):</text><text x="150" y="48" fill="#f5f5f7" font-size="11">Pi Pin 2 (5V Power Rail)</text><circle cx="15" cy="70" r="6" fill="#fff"/><text x="32" y="74" fill="#fff" font-size="12" font-weight="700">Brown (GND):</text><text x="150" y="74" fill="#f5f5f7" font-size="11">Pi Pin 6 (Ground Rail)</text></g></g><g transform="translate(680, 535)"><rect width="480" height="255" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" rx="14"/><text x="24" y="30" fill="#fff" font-size="16" font-weight="700">HC-SR04 Ultrasonic Distance Sensor</text><text x="24" y="48" fill="#30d158" font-size="11" font-weight="500">Front Collision Avoidance • Plug-and-Play Ready (Standby Mode Default)</text><g transform="translate(24, 65)"><circle cx="15" cy="18" r="6" fill="#ff453a"/><text x="32" y="22" fill="#ff453a" font-size="12" font-weight="700">VCC (5V):</text><text x="135" y="22" fill="#f5f5f7" font-size="11">Pi Pin 4 (5V Power Rail)</text><circle cx="15" cy="44" r="6" fill="#ffd60a"/><text x="32" y="48" fill="#ffd60a" font-size="12" font-weight="700">TRIG:</text><text x="135" y="48" fill="#f5f5f7" font-size="11">Pi Pin 18 (GPIO 24, 10µs trigger pulse)</text><circle cx="15" cy="72" r="6" fill="#30d158"/><text x="32" y="76" fill="#30d158" font-size="12" font-weight="700">ECHO (5V Output):</text><text x="175" y="76" fill="#ffd60a" font-size="11" font-weight="700">⚠️ Requires Voltage Divider to Pi Pin 22!</text><g transform="translate(10, 95)"><rect width="415" height="75" fill="#1b1c24" stroke="rgba(255,214,10,0.3)" stroke-width="1" rx="8"/><text x="14" y="20" fill="#ffd60a" font-size="10" font-weight="700">VOLTAGE DIVIDER (Protects Pi 3.3V GPIO from 5V Echo):</text><text x="14" y="45" fill="#fff" font-family="monospace" font-size="11">ECHO (5V) ──[ 1 kΩ Resistor ]──┬──&gt; Pi Pin 22 (GPIO 25) [~3.3V Safe]</text><text x="240" y="62" fill="#fff" font-family="monospace" font-size="11">│</text><text x="210" y="68" fill="#fff" font-family="monospace" font-size="11">[ 2 kΩ Resistor ] ──&gt; GND (Pin 20)</text></g></g></g><path fill="none" stroke="#0a84ff" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 245 C 530 245, 580 150, 680 150"/><path fill="none" stroke="#5e5ce6" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 275 C 520 275, 590 176, 680 176"/><path fill="none" stroke="#bf5af2" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 305 C 510 305, 600 202, 680 202"/><path fill="none" stroke="#ff375f" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 305 C 500 305, 610 224, 680 224"/><path fill="none" stroke="#ff9f0a" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 525 C 540 525, 590 385, 680 385"/><path fill="none" stroke="#ffd60a" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 335 C 530 335, 600 580, 680 580"/><path fill="none" stroke="#30d158" stroke-dasharray="6 3" stroke-width="2.5" d="M 435 395 C 520 395, 600 608, 680 608"/></svg>