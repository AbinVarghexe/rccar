<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" style="background:#0c0d12; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="piGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5436"/>
      <stop offset="100%" stop-color="#133824"/>
    </linearGradient>
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801818"/>
      <stop offset="100%" stop-color="#4d0e0e"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c24"/>
      <stop offset="100%" stop-color="#121318"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background with Grid -->
  <rect width="1280" height="840" fill="url(#bgGrad)"/>
  
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="840" fill="url(#grid)"/>

  <!-- Title & Header -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" font-size="24" font-weight="700" fill="#f5f5f7" letter-spacing="-0.02em">Autonomous RC Car — Hardware Wiring &amp; Pinout Diagram</text>
    <text x="0" y="24" font-size="13" font-weight="500" fill="#86868b">Raspberry Pi 4 Model B (40-Pin Header) • L298N Motor Driver • SG90 Servo • HC-SR04 Ultrasonic • CSI Camera</text>
  </g>

  <!-- ============================================================ -->
  <!-- 1. RASPBERRY PI 4 MODULE (Center-Left)                       -->
  <!-- ============================================================ -->
  <g transform="translate(50, 100)">
    <!-- Pi PCB Box -->
    <rect width="440" height="690" rx="18" fill="url(#piGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="25" y="38" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.01em">Raspberry Pi 4 Model B</text>
    <text x="25" y="58" font-size="11" font-weight="600" fill="#75d69c" letter-spacing="0.05em">40-PIN EXPANSION HEADER (J8)</text>

    <!-- CSI Camera Connector Box -->
    <rect x="25" y="600" width="130" height="55" rx="8" fill="#0d2618" stroke="#34c759" stroke-width="1.2"/>
    <text x="35" y="625" font-size="11" font-weight="700" fill="#ffffff">CSI CAMERA</text>
    <text x="35" y="642" font-size="9" font-weight="500" fill="#8ae0a8">OV5647 Ribbon</text>

    <!-- USB-C Power In -->
    <rect x="25" y="525" width="130" height="55" rx="8" fill="#1b1c24" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <text x="35" y="550" font-size="11" font-weight="700" fill="#ffffff">5V USB-C IN</text>
    <text x="35" y="567" font-size="9" font-weight="500" fill="#86868b">5V / 3A Buck Output</text>

    <!-- 40-Pin Header Visual Pinout Table -->
    <g transform="translate(200, 45)">
      <!-- Header Background -->
      <rect x="0" y="0" width="215" height="625" rx="10" fill="#0f1118" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

      <!-- Pin Columns Header -->
      <text x="35" y="22" font-size="10" font-weight="700" fill="#86868b">PIN (L)</text>
      <text x="145" y="22" font-size="10" font-weight="700" fill="#86868b">PIN (R)</text>

      <!-- Pin Rows (Sample Key Pins) -->
      <!-- Row 1: Pin 1 (3.3V) & Pin 2 (5V Servo) -->
      <circle cx="70" cy="50" r="7" fill="#ff9f0a"/>
      <text x="18" y="54" font-size="10" font-weight="700" fill="#ff9f0a">1 (3V3)</text>

      <circle cx="120" cy="50" r="7" fill="#ff453a" filter="url(#glow)"/>
      <text x="135" y="54" font-size="10" font-weight="700" fill="#ff453a">2 (5V-Servo)</text>

      <!-- Row 2: Pin 3 (SDA) & Pin 4 (5V Ultrasonic) -->
      <circle cx="70" cy="80" r="6" fill="#48484a"/>
      <text x="35" y="84" font-size="9" fill="#86868b">3</text>
      
      <circle cx="120" cy="80" r="7" fill="#ff453a" filter="url(#glow)"/>
      <text x="135" y="84" font-size="10" font-weight="700" fill="#ff453a">4 (5V-US)</text>

      <!-- Row 3: Pin 5 & Pin 6 (GND Servo) -->
      <circle cx="70" cy="110" r="6" fill="#48484a"/>
      <text x="35" y="114" font-size="9" fill="#86868b">5</text>
      
      <circle cx="120" cy="110" r="7" fill="#ffffff" filter="url(#glow)"/>
      <text x="135" y="114" font-size="10" font-weight="700" fill="#ffffff">6 (GND)</text>

      <!-- Row 4 & 5: Pins 7 to 10 -->
      <circle cx="70" cy="140" r="6" fill="#48484a"/><circle cx="120" cy="140" r="6" fill="#48484a"/>
      <circle cx="70" cy="170" r="6" fill="#48484a"/><circle cx="120" cy="170" r="6" fill="#48484a"/>

      <!-- Row 6: Pin 11 (GPIO 17 / IN1) & Pin 12 (GPIO 18 / IN2) -->
      <circle cx="70" cy="200" r="7" fill="#0a84ff" filter="url(#glow)"/>
      <text x="8" y="204" font-size="10" font-weight="700" fill="#0a84ff">11 (IN1)</text>

      <circle cx="120" cy="200" r="7" fill="#5e5ce6" filter="url(#glow)"/>
      <text x="135" y="204" font-size="10" font-weight="700" fill="#5e5ce6">12 (IN2-Alt)</text>

      <!-- Row 7: Pin 13 (GPIO 27 legacy fallback) & Pin 14 (GND) -->
      <circle cx="70" cy="230" r="7" fill="#5e5ce6" filter="url(#glow)"/>
      <text x="8" y="234" font-size="10" font-weight="700" fill="#5e5ce6">13 (IN2)</text>

      <circle cx="120" cy="230" r="6" fill="#48484a"/>
      <text x="135" y="234" font-size="9" fill="#86868b">14 (GND)</text>

      <!-- Row 8: Pin 15 (GPIO 22 / IN3) & Pin 16 (GPIO 23 / IN4) -->
      <circle cx="70" cy="260" r="7" fill="#bf5af2" filter="url(#glow)"/>
      <text x="8" y="264" font-size="10" font-weight="700" fill="#bf5af2">15 (IN3)</text>

      <circle cx="120" cy="260" r="7" fill="#ff375f" filter="url(#glow)"/>
      <text x="135" y="264" font-size="10" font-weight="700" fill="#ff375f">16 (IN4)</text>

      <!-- Row 9: Pin 17 (3.3V) & Pin 18 (GPIO 24 / TRIG) -->
      <circle cx="70" cy="290" r="6" fill="#ff9f0a"/>
      <text x="25" y="294" font-size="9" fill="#ff9f0a">17</text>

      <circle cx="120" cy="290" r="7" fill="#ffd60a" filter="url(#glow)"/>
      <text x="135" y="294" font-size="10" font-weight="700" fill="#ffd60a">18 (TRIG)</text>

      <!-- Row 10: Pin 19 & Pin 20 (GND US / Common) -->
      <circle cx="70" cy="320" r="6" fill="#48484a"/>
      <circle cx="120" cy="320" r="7" fill="#ffffff" filter="url(#glow)"/>
      <text x="135" y="324" font-size="10" font-weight="700" fill="#ffffff">20 (GND)</text>

      <!-- Row 11: Pin 21 & Pin 22 (GPIO 25 / ECHO) -->
      <circle cx="70" cy="350" r="6" fill="#48484a"/>
      
      <circle cx="120" cy="350" r="7" fill="#30d158" filter="url(#glow)"/>
      <text x="135" y="354" font-size="10" font-weight="700" fill="#30d158">22 (ECHO)</text>

      <!-- Middle rows omitted indicator -->
      <line x1="70" y1="375" x2="70" y2="445" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3 3"/>
      <line x1="120" y1="375" x2="120" y2="445" stroke="rgba(255,255,255,0.2)" stroke-dasharray="3 3"/>
      <text x="80" y="415" font-size="9" fill="#636366">...</text>

      <!-- Row 16: Pin 31 & Pin 32 (GPIO 12 / PWM0 Servo) -->
      <circle cx="70" cy="480" r="6" fill="#48484a"/>
      <text x="25" y="484" font-size="9" fill="#86868b">31</text>

      <circle cx="120" cy="480" r="7" fill="#ff9f0a" filter="url(#glow)"/>
      <text x="135" y="484" font-size="10" font-weight="700" fill="#ff9f0a">32 (SERVO)</text>

      <!-- Row 20: Pin 39 (GND) & Pin 40 -->
      <circle cx="70" cy="580" r="7" fill="#ffffff"/>
      <text x="15" y="584" font-size="10" fill="#ffffff">39 (GND)</text>
      <circle cx="120" cy="580" r="6" fill="#48484a"/>
      <text x="135" y="584" font-size="9" fill="#86868b">40</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 2. L298N MOTOR DRIVER (Top Right)                           -->
  <!-- ============================================================ -->
  <g transform="translate(680, 100)">
    <!-- Driver PCB -->
    <rect width="480" height="230" rx="14" fill="url(#motorGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <text x="24" y="32" font-size="16" font-weight="700" fill="#ffffff">L298N Dual H-Bridge Motor Driver</text>
    <text x="24" y="50" font-size="11" font-weight="500" fill="#ffb3b3">100Hz Software PWM Differential Skid Steering</text>

    <!-- Logic Input Terminals (Left side of L298N) -->
    <g transform="translate(24, 75)">
      <rect x="0" y="0" width="200" height="135" rx="8" fill="#1b1c24" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="24" font-size="11" font-weight="700" fill="#86868b">LOGIC INPUT TERMINALS</text>
      
      <!-- IN1 -->
      <circle cx="25" cy="48" r="5" fill="#0a84ff"/>
      <text x="40" y="52" font-size="11" font-weight="700" fill="#ffffff">IN1</text>
      <text x="80" y="52" font-size="10" fill="#86868b">← Pi Pin 11 (GPIO 17)</text>

      <!-- IN2 -->
      <circle cx="25" cy="74" r="5" fill="#5e5ce6"/>
      <text x="40" y="78" font-size="11" font-weight="700" fill="#ffffff">IN2</text>
      <text x="80" y="78" font-size="10" fill="#86868b">← Pi Pin 12 (GPIO 18)</text>

      <!-- IN3 -->
      <circle cx="25" cy="100" r="5" fill="#bf5af2"/>
      <text x="40" y="104" font-size="11" font-weight="700" fill="#ffffff">IN3</text>
      <text x="80" y="104" font-size="10" fill="#86868b">← Pi Pin 15 (GPIO 22)</text>

      <!-- IN4 -->
      <circle cx="25" cy="122" r="5" fill="#ff375f"/>
      <text x="40" y="126" font-size="11" font-weight="700" fill="#ffffff">IN4</text>
      <text x="80" y="126" font-size="10" fill="#86868b">← Pi Pin 16 (GPIO 23)</text>
    </g>

    <!-- Power & Motor Screw Terminals (Right side of L298N) -->
    <g transform="translate(248, 75)">
      <rect x="0" y="0" width="208" height="135" rx="8" fill="#1b1c24" stroke="rgba(255,255,255,0.1)"/>
      <text x="14" y="24" font-size="11" font-weight="700" fill="#86868b">POWER &amp; MOTOR OUTPUTS</text>
      
      <text x="14" y="50" font-size="11" font-weight="700" fill="#ff453a">12V / VCC:</text>
      <text x="85" y="50" font-size="10" fill="#f5f5f7">Battery (+) 7.4V - 12V</text>

      <text x="14" y="74" font-size="11" font-weight="700" fill="#ffffff">GND:</text>
      <text x="85" y="74" font-size="10" fill="#f5f5f7">Battery (-) &amp; Pi Pin 6</text>

      <text x="14" y="98" font-size="11" font-weight="700" fill="#30d158">OUT 1 / 2:</text>
      <text x="85" y="98" font-size="10" fill="#f5f5f7">Left DC Motors</text>

      <text x="14" y="122" font-size="11" font-weight="700" fill="#30d158">OUT 3 / 4:</text>
      <text x="85" y="122" font-size="10" fill="#f5f5f7">Right DC Motors</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 3. SG90 CAMERA PAN SERVO (Middle Right)                     -->
  <!-- ============================================================ -->
  <g transform="translate(680, 360)">
    <rect width="480" height="145" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#ffffff">SG90 Camera Pan Servo Motor</text>
    <text x="24" y="48" font-size="11" font-weight="500" fill="#86868b">180° Panoramic Sweep (0° Left, 90° Center, 180° Right) • Auto-Relax Protection</text>

    <!-- Servo Pinout Labels -->
    <g transform="translate(24, 65)">
      <!-- Orange Wire (PWM) -->
      <circle cx="15" cy="18" r="6" fill="#ff9f0a"/>
      <text x="32" y="22" font-size="12" font-weight="700" fill="#ff9f0a">Orange (PWM):</text>
      <text x="150" y="22" font-size="11" fill="#f5f5f7">Pi Pin 32 (GPIO 12, Hardware PWM0)</text>

      <!-- Red Wire (5V) -->
      <circle cx="15" cy="44" r="6" fill="#ff453a"/>
      <text x="32" y="48" font-size="12" font-weight="700" fill="#ff453a">Red (VCC 5V):</text>
      <text x="150" y="48" font-size="11" fill="#f5f5f7">Pi Pin 2 (5V Power Rail)</text>

      <!-- Brown Wire (GND) -->
      <circle cx="15" cy="70" r="6" fill="#ffffff"/>
      <text x="32" y="74" font-size="12" font-weight="700" fill="#ffffff">Brown (GND):</text>
      <text x="150" y="74" font-size="11" fill="#f5f5f7">Pi Pin 6 (Ground Rail)</text>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 4. HC-SR04 ULTRASONIC SENSOR & VOLTAGE DIVIDER (Bottom Right) -->
  <!-- ============================================================ -->
  <g transform="translate(680, 535)">
    <rect width="480" height="255" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="24" y="30" font-size="16" font-weight="700" fill="#ffffff">HC-SR04 Ultrasonic Distance Sensor</text>
    <text x="24" y="48" font-size="11" font-weight="500" fill="#30d158">Front Collision Avoidance • Plug-and-Play Ready (Standby Mode Default)</text>

    <g transform="translate(24, 65)">
      <!-- VCC (5V) -->
      <circle cx="15" cy="18" r="6" fill="#ff453a"/>
      <text x="32" y="22" font-size="12" font-weight="700" fill="#ff453a">VCC (5V):</text>
      <text x="135" y="22" font-size="11" fill="#f5f5f7">Pi Pin 4 (5V Power Rail)</text>

      <!-- TRIG -->
      <circle cx="15" cy="44" r="6" fill="#ffd60a"/>
      <text x="32" y="48" font-size="12" font-weight="700" fill="#ffd60a">TRIG:</text>
      <text x="135" y="48" font-size="11" fill="#f5f5f7">Pi Pin 18 (GPIO 24, 10µs trigger pulse)</text>

      <!-- ECHO with Voltage Divider Alert -->
      <circle cx="15" cy="72" r="6" fill="#30d158"/>
      <text x="32" y="76" font-size="12" font-weight="700" fill="#30d158">ECHO (5V Output):</text>
      <text x="175" y="76" font-size="11" font-weight="700" fill="#ffd60a">⚠️ Requires Voltage Divider to Pi Pin 22!</text>

      <!-- Voltage Divider Schematic Box -->
      <g transform="translate(10, 95)">
        <rect width="415" height="75" rx="8" fill="#1b1c24" stroke="rgba(255,214,10,0.3)" stroke-width="1"/>
        <text x="14" y="20" font-size="10" font-weight="700" fill="#ffd60a">VOLTAGE DIVIDER (Protects Pi 3.3V GPIO from 5V Echo):</text>
        
        <text x="14" y="45" font-size="11" font-family="monospace" fill="#ffffff">ECHO (5V) ──[ 1 kΩ Resistor ]──┬──&gt; Pi Pin 22 (GPIO 25) [~3.3V Safe]</text>
        <text x="240" y="62" font-size="11" font-family="monospace" fill="#ffffff">│</text>
        <text x="210" y="68" font-size="11" font-family="monospace" fill="#ffffff">[ 2 kΩ Resistor ] ──&gt; GND (Pin 20)</text>
      </g>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- 5. WIRE TRACES (CONNECTING PI TO SUBSYSTEMS)                 -->
  <!-- ============================================================ -->
  <!-- Wire IN1 (Pi Pin 11 to L298N IN1) -->
  <path d="M 435 245 C 530 245, 580 150, 680 150" fill="none" stroke="#0a84ff" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire IN2 (Pi Pin 12 to L298N IN2) -->
  <path d="M 435 275 C 520 275, 590 176, 680 176" fill="none" stroke="#5e5ce6" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire IN3 (Pi Pin 15 to L298N IN3) -->
  <path d="M 435 305 C 510 305, 600 202, 680 202" fill="none" stroke="#bf5af2" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire IN4 (Pi Pin 16 to L298N IN4) -->
  <path d="M 435 305 C 500 305, 610 224, 680 224" fill="none" stroke="#ff375f" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire Servo PWM (Pi Pin 32 to Servo PWM) -->
  <path d="M 435 525 C 540 525, 590 385, 680 385" fill="none" stroke="#ff9f0a" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire Ultrasonic TRIG (Pi Pin 18 to US TRIG) -->
  <path d="M 435 335 C 530 335, 600 580, 680 580" fill="none" stroke="#ffd60a" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Wire Ultrasonic ECHO (Pi Pin 22 to US ECHO) -->
  <path d="M 435 395 C 520 395, 600 608, 680 608" fill="none" stroke="#30d158" stroke-width="2.5" stroke-dasharray="6 3"/>

</svg>
