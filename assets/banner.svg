<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#0D1527" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="75%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="20%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="radarFront" cx="0%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for UI Elements -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="20%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="laneGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#glowCyan)" />
  <rect width="1200" height="420" fill="url(#glowPurple)" />

  <!-- Technical Grid Pattern -->
  <g opacity="0.12" stroke="#64748B" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <!-- Vertical lines -->
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="160" y1="0" x2="160" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="640" y1="0" x2="640" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1120" y1="0" x2="1120" y2="420" />
  </g>

  <!-- Circuit Trace Accents -->
  <g opacity="0.35" stroke="#38BDF8" stroke-width="1.5" fill="none">
    <path d="M 50 80 L 140 80 L 170 110 L 290 110" />
    <circle cx="290" cy="110" r="3" fill="#38BDF8" />
    <circle cx="50" cy="80" r="3" fill="#38BDF8" />

    <path d="M 60 380 L 150 380 L 180 350 L 320 350" />
    <circle cx="320" cy="350" r="3" fill="#38BDF8" />

    <path d="M 1150 70 L 1050 70 L 1020 100 L 960 100" />
    <circle cx="960" cy="100" r="3" fill="#06B6D4" />
  </g>

  <!-- ================= RIGHT SIDE: TECHNICAL RC CAR & COMPUTER VISION HUD ================= -->
  <g transform="translate(680, 25)">
    <!-- HUD Screen Container Frame -->
    <rect x="0" y="15" width="480" height="350" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="6" y="21" width="468" height="338" rx="12" fill="#030712" fill-opacity="0.8" />

    <!-- Viewport Horizon & Perspective Road Floor -->
    <g opacity="0.85">
      <!-- Perspective Lane Lines (Trapezoid Road) -->
      <polygon points="120,340 360,340 280,140 200,140" fill="url(#laneGrad)" />
      
      <!-- Lane Boundary Lines -->
      <line x1="120" y1="340" x2="200" y2="140" stroke="#06B6D4" stroke-width="3.5" filter="url(#subtleGlow)" />
      <line x1="360" y1="340" x2="280" y2="140" stroke="#06B6D4" stroke-width="3.5" filter="url(#subtleGlow)" />
      
      <!-- Dashed Center Guided Path -->
      <line x1="240" y1="340" x2="240" y2="145" stroke="#F59E0B" stroke-width="3" stroke-dasharray="12,10" filter="url(#subtleGlow)" />
      
      <!-- Centroid Tracking Crosshair -->
      <circle cx="240" cy="220" r="14" fill="none" stroke="#EF4444" stroke-width="2" />
      <line x1="220" y1="220" x2="260" y2="220" stroke="#EF4444" stroke-width="1.5" />
      <line x1="240" y1="200" x2="240" y2="240" stroke="#EF4444" stroke-width="1.5" />
      <text x="265" y="215" fill="#EF4444" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="bold">TARGET LOCK: e=0.0px</text>

      <!-- Corridor Boundary Rays -->
      <line x1="180" y1="340" x2="220" y2="140" stroke="#10B981" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
      <line x1="300" y1="340" x2="260" y2="140" stroke="#10B981" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    </g>

    <!-- Ultrasonic Radar Pulses (Arc Waves) -->
    <g stroke="#10B981" fill="none" opacity="0.75" filter="url(#subtleGlow)">
      <path d="M 210,135 A 40,40 0 0,1 270,135" stroke-width="2" />
      <path d="M 195,120 A 65,65 0 0,1 285,120" stroke-width="2.5" />
      <path d="M 180,105 A 90,90 0 0,1 300,105" stroke-width="1.5" stroke-dasharray="6,4" />
      <path d="M 165,90 A 115,115 0 0,1 315,90" stroke-width="1" stroke-dasharray="4,4" />
    </g>

    <!-- YOLOv8 Detected Object 1: Traffic Cone / Hazard -->
    <g transform="translate(265, 120)">
      <rect x="0" y="0" width="45" height="50" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.8" filter="url(#subtleGlow)" />
      <rect x="0" y="-14" width="45" height="14" fill="#F59E0B" />
      <text x="3" y="-3" fill="#000" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">CONE 94%</text>
      <!-- Cone silhouette inside -->
      <polygon points="22,6 34,44 10,44" fill="#F59E0B" opacity="0.7" />
    </g>

    <!-- YOLOv8 Detected Object 2: Approaching Vehicle -->
    <g transform="translate(145, 95)">
      <rect x="0" y="0" width="55" height="42" rx="3" fill="none" stroke="#38BDF8" stroke-width="1.8" filter="url(#subtleGlow)" />
      <rect x="0" y="-14" width="55" height="14" fill="#0284C7" />
      <text x="3" y="-3" fill="#FFF" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold">CAR 98% [TTC 4.2s]</text>
    </g>

    <!-- 4WD RC Car Robot Chassis (Top-Down Isometric Silhouette at Bottom) -->
    <g transform="translate(180, 245)">
      <!-- Left Wheels -->
      <rect x="0" y="5" width="16" height="36" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="0" y1="17" x2="16" y2="17" stroke="#38BDF8" stroke-width="1" />
      <line x1="0" y1="29" x2="16" y2="29" stroke="#38BDF8" stroke-width="1" />

      <rect x="0" y="55" width="16" height="36" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="0" y1="67" x2="16" y2="67" stroke="#38BDF8" stroke-width="1" />
      <line x1="0" y1="79" x2="16" y2="79" stroke="#38BDF8" stroke-width="1" />

      <!-- Right Wheels -->
      <rect x="104" y="5" width="16" height="36" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="104" y1="17" x2="120" y2="17" stroke="#38BDF8" stroke-width="1" />
      <line x1="104" y1="29" x2="120" y2="29" stroke="#38BDF8" stroke-width="1" />

      <rect x="104" y="55" width="16" height="36" rx="5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <line x1="104" y1="67" x2="120" y2="67" stroke="#38BDF8" stroke-width="1" />
      <line x1="104" y1="79" x2="120" y2="79" stroke="#38BDF8" stroke-width="1" />

      <!-- Central Acrylic Chassis Base -->
      <rect x="20" y="0" width="80" height="96" rx="12" fill="url(#carBodyGrad)" stroke="#475569" stroke-width="2" />
      
      <!-- Raspberry Pi 4 Micro-outline -->
      <rect x="28" y="24" width="64" height="48" rx="5" fill="#064E3B" stroke="#10B981" stroke-width="1.2" opacity="0.9" />
      <!-- SoC & GPIO Header pins -->
      <rect x="48" y="38" width="18" height="18" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1" />
      <text x="50" y="50" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="bold">RPi 4</text>
      <line x1="32" y1="28" x2="88" y2="28" stroke="#F59E0B" stroke-width="2" stroke-dasharray="2,2" />

      <!-- Front Dual Ultrasonic Sensors (HC-SR04 Bar) -->
      <rect x="34" y="-8" width="52" height="14" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" />
      <!-- Left & Right Ultrasonic Transducer Cylinders -->
      <circle cx="46" cy="-1" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
      <circle cx="46" cy="-1" r="2" fill="#06B6D4" />
      <circle cx="74" cy="-1" r="5" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5" />
      <circle cx="74" cy="-1" r="2" fill="#06B6D4" />

      <!-- Front Camera (Picamera2 Lens Mount) -->
      <rect x="53" y="6" width="14" height="12" rx="2" fill="#0F172A" stroke="#EF4444" stroke-width="1.2" />
      <circle cx="60" cy="12" r="3.5" fill="#EF4444" />
    </g>

    <!-- Top Overlay HUD Telemetry Header -->
    <rect x="12" y="28" width="456" height="34" rx="6" fill="#0F172A" fill-opacity="0.9" stroke="#1E293B" stroke-width="1" />
    <!-- Status Dot -->
    <circle cx="28" cy="45" r="4.5" fill="#10B981" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="49" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STATE: AUTONOMOUS_CRUISE</text>
    <text x="245" y="49" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">SPEED: 75%</text>
    <text x="330" y="49" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">DIST: 84.2cm</text>
    <text x="425" y="49" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">30 FPS</text>

    <!-- Bottom HUD Sensor Readout Bar -->
    <rect x="12" y="322" width="456" height="28" rx="6" fill="#0F172A" fill-opacity="0.95" stroke="#1E293B" stroke-width="1" />
    <text x="24" y="340" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">FRONT SONAR: <tspan fill="#10B981" font-weight="bold">CLEAR (84cm)</tspan></text>
    <text x="180" y="340" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">REAR SONAR: <tspan fill="#38BDF8" font-weight="bold">142cm</tspan></text>
    <text x="315" y="340" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">UART LINK: <tspan fill="#10B981" font-weight="bold">ONLINE (0% LOSS)</tspan></text>
  </g>

  <!-- ================= LEFT SIDE: PROJECT IDENTITY & TECH STACK ================= -->
  <g transform="translate(60, 48)">
    
    <!-- Top System Live Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2" />
      <circle cx="14" cy="13" r="4" fill="#06B6D4" filter="url(#subtleGlow)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="26" y="17" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" letter-spacing="1.5">ROBOTICS STACK • V2.4</text>
    </g>

    <!-- Main Repository Title -->
    <text x="0" y="75" fill="url(#titleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      MODULAR RC CAR
    </text>
    <text x="0" y="112" fill="#38BDF8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">
      Full-Stack Autonomous Driving &amp; Computer Vision
    </text>

    <!-- Divider Glow Bar -->
    <rect x="0" y="128" width="540" height="2" fill="url(#cyanLine)" />

    <!-- Core Description Text -->
    <text x="0" y="156" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400">
      Production-grade 4WD autonomous vehicle architecture pairing
    </text>
    <text x="0" y="178" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="500">
      <tspan fill="#38BDF8" font-weight="700">Raspberry Pi 4</tspan> vision intelligence with <tspan fill="#10B981" font-weight="700">Arduino UNO</tspan> real-time motor control.
    </text>
    <text x="0" y="200" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
      Features Picamera2 lane tracking, closed-loop PID, and YOLOv8 spatial hazard detection.
    </text>

    <!-- Technology Pills Grid (Row 1) -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Raspberry Pi 4 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="125" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#EF4444" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Raspberry Pi 4</text>
      </g>

      <!-- Pill 2: Arduino Serial UART -->
      <g transform="translate(133, 0)">
        <rect x="0" y="0" width="138" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#0EA5E9" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Arduino UNO UART</text>
      </g>

      <!-- Pill 3: Picamera2 CSI -->
      <g transform="translate(279, 0)">
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#10B981" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Picamera2 CSI</text>
      </g>

      <!-- Pill 4: YOLOv8 AI -->
      <g transform="translate(405, 0)">
        <rect x="0" y="0" width="115" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#A855F7" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Ultralytics AI</text>
      </g>
    </g>

    <!-- Technology Pills Grid (Row 2) -->
    <g transform="translate(0, 268)">
      <!-- Pill 5: Dual Ultrasonic -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="135" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#06B6D4" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Dual HC-SR04 Sonar</text>
      </g>

      <!-- Pill 6: Discrete PID -->
      <g transform="translate(143, 0)">
        <rect x="0" y="0" width="128" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#F59E0B" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">PID Closed Loop</text>
      </g>

      <!-- Pill 7: Flask MJPEG Telemetry -->
      <g transform="translate(279, 0)">
        <rect x="0" y="0" width="145" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#EC4899" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Flask Web Dashboard</text>
      </g>

      <!-- Pill 8: Python 3.11 -->
      <g transform="translate(432, 0)">
        <rect x="0" y="0" width="96" height="28" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1.2" />
        <circle cx="12" cy="14" r="3.5" fill="#3B82F6" />
        <text x="22" y="18" fill="#F1F5F9" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">Python 3.11</text>
      </g>
    </g>

    <!-- Footer Stats / Spec Badges -->
    <g transform="translate(0, 316)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">
        BAUD: <tspan fill="#38BDF8">115200</tspan>  |  FPS: <tspan fill="#10B981">30.0</tspan>  |  LATENCY: <tspan fill="#38BDF8">&lt;35ms</tspan>  |  CHASSIS: <tspan fill="#F1F5F9">4WD TT Motors</tspan>
      </text>
    </g>

  </g>

  <!-- Outer Fine Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="0" fill="none" stroke="#1E293B" stroke-width="2" />
</svg>
